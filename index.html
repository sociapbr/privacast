<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Focus - Expectativas de Mercado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="/css/layout.css" rel="stylesheet" type="text/css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #008080, #006666);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .focus-badge {
            background: white;
            color: #008080;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .header-right {
            text-align: right;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: flex-end;
        }

        .header-button {
            background: white;
            color: #008080;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }

        .header-button:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .date {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .legend {
            font-size: 12px;
            display: flex;
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .subtitle {
            background-color: #e0e0e0;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #666;
        }

        .main-title {
            background-color: #008080;
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        .table-container {
            background: white;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .year-section {
            margin-bottom: 30px;
        }

        .year-header {
            background: linear-gradient(135deg, #008080, #006666);
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        th {
            background-color: #f8f8f8;
            font-weight: bold;
            color: #555;
        }

        .indicator-name {
            text-align: left;
            font-weight: bold;
            background-color: #f0f0f0;
            padding-left: 15px;
        }

        .positive {
            color: #0066cc;
        }

        .negative {
            color: #cc0000;
        }

        .indicator {
            font-size: 12px;
            margin-left: 5px;
        }

        .respondents {
            color: #999;
            font-size: 12px;
        }

        .charts-section {
            margin: 30px 20px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chart-container {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e0e0e0;
        }

        .chart-title {
            font-size: 14px;
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
            text-align: center;
        }

        .chart-canvas {
            max-height: 200px;
        }

        .footer {
            background-color: #f0f0f0;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }

        .footer-note {
            margin-bottom: 8px;
        }

        .admin-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #008080, #006666);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .admin-button:hover {
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #008080;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .header-left {
                flex-direction: column;
                gap: 10px;
            }
            
            .legend {
                flex-direction: column;
                gap: 5px;
            }
            
            th, td {
                padding: 8px 4px;
                font-size: 12px;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .header-actions {
                justify-content: center;
            }

            .header-button {
                padding: 6px 10px;
                font-size: 12px;
            }
            .admin-button {
                bottom: 10px;
                right: 10px;
                padding: 12px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>

        // Função para carregar dados do localStorage
        function loadData() {
            const savedData = localStorage.getItem('focusData');
            if (savedData) {
                focusData = JSON.parse(savedData);
            }
        }

        // Função para atualizar a data atual
        function updateDate() {
            const now = new Date();
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('pt-BR', options);
        }

        // Função para criar tabela HTML
        function createTable(year, data) {
            const indicators = [
                { key: 'ipca', name: 'IPCA (variação %)' },
                { key: 'pib', name: 'PIB Total (variação % sobre ano anterior)' },
                { key: 'cambio', name: 'Câmbio (R$/US$)' },
                { key: 'selic', name: 'Selic (% a.a.)' },
                { key: 'igpm', name: 'IGP-M (variação %)' },
                { key: 'ipcaadm', name: 'IPCA Administrados (variação %)' },
                { key: 'conta', name: 'Conta corrente (US$ bilhões)' },
                { key: 'balanca', name: 'Balança comercial (US$ bilhões)' },
                { key: 'invest', name: 'Investimento direto no país (US$ bilhões)' },
                { key: 'divida', name: 'Dívida líquida do setor público (% do PIB)' },
                { key: 'primario', name: 'Resultado primário (% do PIB)' },
                { key: 'nominal', name: 'Resultado nominal (% do PIB)' }
            ];

            let tableHTML = `
                <div class="year-section">
                    <div class="year-header">${year}</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left;">Indicadores</th>
                                <th>Há 4 semanas</th>
                                <th>Há 1 semana</th>
                                <th>Hoje (Comp. semanal)</th>
                                <th>Resp.</th>
                                <th>5 dias</th>
                                <th>Resp. 5 dias</th>
                                <th>Comp. semanal</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            indicators.forEach(indicator => {
                const indicatorData = data[indicator.key];
                const valueClass = indicatorData.hoje < 0 ? 'negative' : 'positive';
                
                tableHTML += `
                    <tr>
                        <td class="indicator-name">${indicator.name}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.semanas4)}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.semana1)}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.hoje)} <span class="indicator">${indicatorData.variacao}</span></td>
                        <td class="respondents">${indicatorData.resp}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.dias5)}</td>
                        <td class="respondents">${indicatorData.resp5}</td>
                        <td><span class="indicator">${indicatorData.variacao}</span></td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            return tableHTML;
        }

        // Função para formatar números
        function formatNumber(num) {
            if (typeof num === 'number') {
                return num.toFixed(2).replace('.', ',');
            }
            return num;
        }

        // Função para criar gráfico
        function createChart(containerId, title, dataKey, colors) {
            const ctx = document.getElementById(containerId).getContext('2d');
            const years = ['2025', '2026', '2027', '2028'];
            const values = years.map(year => focusData[year][dataKey].hoje);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: title,
                        data: values,
                        borderColor: colors[0],
                        backgroundColor: colors[1],
                        borderWidth: 2,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: '#f0f0f0'
                            }
                        },
                        x: {
                            grid: {
                                color: '#f0f0f0'
                            }
                        }
                    }
                }
            });
        }

        // Função para renderizar todo o conteúdo
        function renderContent() {
            // Renderizar tabelas
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = '';
            
            ['2025', '2026', '2027', '2028'].forEach(year => {
                tableContainer.innerHTML += createTable(year, focusData[year]);
            });

            // Renderizar gráficos
            const chartsGrid = document.getElementById('chartsGrid');
            chartsGrid.innerHTML = '';

            const charts = [
                { id: 'ipcaChart', title: 'IPCA', dataKey: 'ipca', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'pibChart', title: 'PIB Total', dataKey: 'pib', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'cambioChart', title: 'Câmbio', dataKey: 'cambio', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'selicChart', title: 'Selic', dataKey: 'selic', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'igpmChart', title: 'IGP-M', dataKey: 'igpm', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'ipcaAdmChart', title: 'IPCA Administrados', dataKey: 'ipcaadm', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'contaCorrenteChart', title: 'Conta Corrente', dataKey: 'conta', colors: ['#cc0000', '#ffe6e6'] },
                { id: 'investimentoChart', title: 'Investimento Direto', dataKey: 'invest', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'dividaChart', title: 'Dívida Líquida', dataKey: 'divida', colors: ['#0066cc', '#e6f2ff'] }
            ];

            charts.forEach(chart => {
                chartsGrid.innerHTML += `
                    <div class="chart-container">
                        <div class="chart-title">${chart.title}</div>
                        <canvas id="${chart.id}" class="chart-canvas"></canvas>
                    </div>
                `;
            });

            // Criar gráficos após adicionar ao DOM
            setTimeout(() => {
                charts.forEach(chart => {
                    createChart(chart.id, chart.title, chart.dataKey, chart.colors);
                });
            }, 100);
        }

        // Função para abrir a página de administração
        function openAdmin() {
            window.open('admin.html', '_blank');
        }

        function openConnect() {
            window.open('connect.html', '_blank');
        }

        // Função para atualizar dados (chamada pela página de administração)
        function updateBoletimData(newData) {
            focusData = newData;
            renderContent();
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            updateDate();
            renderContent();
            
            // Esconder mensagem de loading e mostrar conteúdo
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'block';
            document.getElementById('chartsSection').style.display = 'block';
        });

        // Atualizar a cada 30 segundos para verificar mudanças nos dados
        setInterval(function() {
            const savedData = localStorage.getItem('focusData');
            if (savedData) {
                const newData = JSON.parse(savedData);
                if (JSON.stringify(newData) !== JSON.stringify(focusData)) {
                    focusData = newData;
                    renderContent();
                }
            }
        }, 30000); // Verificar a cada 30 segundos
    </script>
</body>
</html>
