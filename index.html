        // Função para carregar dados do localStorage
        function loadData() {
            const savedData = localStorage.getItem('focusData');
            if (savedData) {
                focusData = JSON.parse(savedData);
            }
        }

        // Função para criar tabela HTML
        function createTable(year, data) {
            const indicators = [
                { key: 'ipca', name: 'IPCA (variação %)' },
                { key: 'pib', name: 'PIB Total (variação % sobre ano anterior)' },
                { key: 'cambio', name: 'Câmbio (R$/US$)' },
                { key: 'selic', name: 'Selic (% a.a.)' },
                { key: 'igpm', name: 'IGP-M (variação %)' },
                { key: 'ipcaadm', name: 'IPCA Administrados (variação %)' },
                { key: 'conta', name: 'Conta corrente (US$ bilhões)' },
                { key: 'balanca', name: 'Balança comercial (US$ bilhões)' },
                { key: 'invest', name: 'Investimento direto no país (US$ bilhões)' },
                { key: 'divida', name: 'Dívida líquida do setor público (% do PIB)' },
                { key: 'primario', name: 'Resultado primário (% do PIB)' },
                { key: 'nominal', name: 'Resultado nominal (% do PIB)' }
            ];

            let tableHTML = `
                <div class="year-section">
                    <div class="year-header">${year}</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left;">Indicadores</th>
                                <th>Há 4 semanas</th>
                                <th>Há 1 semana</th>
                                <th>Hoje (Comp. semanal)</th>
                                <th>Resp.</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            indicators.forEach(indicator => {
                const indicatorData = data[indicator.key];
                const valueClass = indicatorData.hoje < 0 ? 'negative' : 'positive';
                
                tableHTML += `
                    <tr>
                        <td class="indicator-name">${indicator.name}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.semanas4)}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.semana1)}</td>
                        <td class="${valueClass}">${formatNumber(indicatorData.hoje)} <span class="indicator">${indicatorData.variacao}</span></td>
                        <td class="respondents">${indicatorData.resp}</td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            return tableHTML;
        }

        // Função para formatar números
        function formatNumber(num) {
            if (typeof num === 'number') {
                return num.toFixed(2).replace('.', ',');
            }
            return num;
        }

        // Função para criar gráfico
        function createChart(containerId, title, dataKey, colors) {
            const ctx = document.getElementById(containerId).getContext('2d');
            const years = ['2025', '2026', '2027', '2028'];
            const values = years.map(year => focusData[year][dataKey].hoje);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: title,
                        data: values,
                        borderColor: colors[0],
                        backgroundColor: colors[1],
                        borderWidth: 2,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: '#f0f0f0'
                            }
                        },
                        x: {
                            grid: {
                                color: '#f0f0f0'
                            }
                        }
                    }
                }
            });
        }

        // Função para renderizar todo o conteúdo
        function renderContent() {
            // Renderizar tabelas
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = '';
            
            ['2025', '2026', '2027', '2028'].forEach(year => {
                tableContainer.innerHTML += createTable(year, focusData[year]);
            });

            // Renderizar gráficos
            const chartsGrid = document.getElementById('chartsGrid');
            chartsGrid.innerHTML = '';

            const charts = [
                { id: 'ipcaChart', title: 'IPCA', dataKey: 'ipca', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'pibChart', title: 'PIB Total', dataKey: 'pib', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'cambioChart', title: 'Câmbio', dataKey: 'cambio', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'selicChart', title: 'Selic', dataKey: 'selic', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'igpmChart', title: 'IGP-M', dataKey: 'igpm', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'ipcaAdmChart', title: 'IPCA Administrados', dataKey: 'ipcaadm', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'contaCorrenteChart', title: 'Conta Corrente', dataKey: 'conta', colors: ['#cc0000', '#ffe6e6'] },
                { id: 'investimentoChart', title: 'Investimento Direto', dataKey: 'invest', colors: ['#0066cc', '#e6f2ff'] },
                { id: 'dividaChart', title: 'Dívida Líquida', dataKey: 'divida', colors: ['#0066cc', '#e6f2ff'] }
            ];

            charts.forEach(chart => {
                chartsGrid.innerHTML += `
                    <div class="chart-container">
                        <div class="chart-title">${chart.title}</div>
                        <canvas id="${chart.id}" class="chart-canvas"></canvas>
                    </div>
                `;
            });

            // Criar gráficos após adicionar ao DOM
            setTimeout(() => {
                charts.forEach(chart => {
                    createChart(chart.id, chart.title, chart.dataKey, chart.colors);
                });
            }, 100);
        }

        function closeConnect() {
            alert('To be implemented');
        }

        // Função para atualizar dados (chamada pela página de administração)
        function updateBoletimData(newData) {
            focusData = newData;
            renderContent();
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderContent();
            
            // Esconder mensagem de loading e mostrar conteúdo
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('tableContainer').style.display = 'block';
            document.getElementById('chartsSection').style.display = 'block';
        });

        // Atualizar a cada 30 segundos para verificar mudanças nos dados
        setInterval(function() {
            const savedData = localStorage.getItem('focusData');
            if (savedData) {
                const newData = JSON.parse(savedData);
                if (JSON.stringify(newData) !== JSON.stringify(focusData)) {
                    focusData = newData;
                    renderContent();
                }
            }
        }, 30000); // Verificar a cada 30 segundos
