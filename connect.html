<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar Carteira</title>
    <link href="/css/layout.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">Forecast</div>
        </div>
        <div class="header-right">
            <button class="outline" onclick="goBack()">Return</button>
        </div>
    <script>
        function goBack() {
            window.location.href = "/";
        }
    </script>
    </div>

    <div class="container">
        <div class="title">Connect Wallet</div>
        <div class="subtitle">After connecting, you can access your benefits and exclusive features.</div>

        <div class="wallets">
            <div class="wallet-button" id="btnLace">
                <div class="wallet-icon"><img src="https://lomhgu666iezj7scwl43dgsxtck5wehpccmcvqd237t3xqirf6ba.turbo-gateway.com/W5hzU97yCZT-QrL5sZpXmJXbEO8QmCrAet_nu8ERL4I?" style="width:100%;height:100%;object-fit:contain;border-radius:6px;"></div>
                <div>
                    <div class="wallet-name">Lace</div>
                    <div class="wallet-desc">Connect using your browser</div>
                </div>
            </div>
            <div class="wallet-button" id="btnEternl">
                <div class="wallet-icon"><img src="https://p6zf7ycfb57cnb7plvlon2fth2ztgxppdps3vmrlamwgsnolgroa.turbo-gateway.com/f7Jf4EUPfiaH711W5uizPrMzXe8b5bqyKwMsaTXLNFw?" style="width:100%;height:100%;object-fit:contain;border-radius:6px;"></div>
                <div>
                    <div class="wallet-name">Eternl</div>
                    <div class="wallet-desc">Connect using your browser</div>
                </div>
            </div>
            <div class="wallet-button" id="btnNufi">
                <div class="wallet-icon"><img src="https://uvf3l755xuhobpkr4k6xus635xdw7lqpj2ynoou4tl62ucmb4m4a.turbo-gateway.com/pUu1_729DuC9UeK9ekvb7cdvrg9OsNc6nJr9qgmB4zg?" style="width:100%;height:100%;object-fit:contain;border-radius:6px;"></div>
                <div>
                    <div class="wallet-name">Nufi</div>
                    <div class="wallet-desc">Connect using your browser</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function connectEternl() { 
            if (!window.cardano || !window.cardano.eternl) {
                alert('Eternl Wallet não encontrada!');
            }
            window.cardano.eternl.enable({'extensions': [{'cip':30}]})
            .then(res => {
                window.location.href = "/?w=eternl";
            });
        }
        function connectLace() {
            if (!window.cardano || !window.cardano.lace) {
                alert('Lace Wallet não encontrada!');
            }
            window.cardano.lace.enable({'extensions': [{'cip':30}]})
            .then(res => {
                window.location.href = "/?w=lace";
            });
        }
        function connectNufi() {
            if (!window.cardano || !window.cardano.nufi) {
                alert('Nufi Wallet não encontrada!');
            }
            window.cardano.nufi.enable({'extensions': [{'cip':30}]})
            .then(res => {
                window.location.href = "/?w=nufi";
            });
        }
        document.getElementById('btnLace').addEventListener('click', connectLace);
        document.getElementById('btnEternl').addEventListener('click', connectEternl);
        document.getElementById('btnNufi').addEventListener('click', connectNufi);
    </script>
</body>
</html>
